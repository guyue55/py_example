[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "example"
dynamic = ["version"]
description = "A minimal Python SDK utility template: HTTP client wrapper with auth, retry, and error handling."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["sdk", "http", "client", "template"]
dependencies = ["requests>=2.33,<3", "urllib3>=2.8,<3"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/guyue55/py_example"
"Bug Reports" = "https://github.com/guyue55/py_example/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "mypy>=1.0,<2", "types-requests", "build>=1,<2", "packaging>=24", "twine>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "example.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

name: Publish

# Publishes the package to PyPI using Trusted Publishing (OIDC) — no API token
# is stored in the repository.
#
# IMPORTANT (template users):
#   1. This workflow is inert until you (a) rename the package to a real name
#      via scripts/rename_template.py and (b) configure a "Trusted Publisher"
#      for that package name on PyPI (and optionally TestPyPI) pointing at this
#      repo + the `publish.yml` workflow + an `v*.*.*` tag scope. See docs/PUBLISHING.md.
#   2. The template ships with the placeholder name `example` and is NOT meant
#      to be published as-is.
#   3. To validate against TestPyPI first, uncomment the `repository-url` line
#      below and configure a TestPyPI Trusted Publisher for the same name.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # with:
        #   repository-url: https://test.pypi.org/legacy/   # uncomment for TestPyPI

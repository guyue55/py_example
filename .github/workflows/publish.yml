name: Publish

# 模板默认不可上传；复制后须显式启用仓库变量并配置受保护环境与PyPI信任。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已在main中验证的版本标签，例如v0.4.0'
        required: true
        type: string
      target:
        description: '目标索引'
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository != 'guyue55/py_example' && vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: 标签格式、main归属与非占位元数据
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          release_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$release_sha" origin/main
          git checkout --detach "$release_sha"
          python scripts/check_release.py --tag "$RELEASE_TAG"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
  build:
    needs: [preflight, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/verify_package.py --artifacts dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-${{ needs.preflight.outputs.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions-${{ needs.preflight.outputs.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

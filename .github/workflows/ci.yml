name: CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-2025
            python-version: '3.13'
          - os: macos-15
            python-version: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装开发工具和模板
        run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests scripts
      - run: mypy src
      - run: python -m pytest -q
      - name: 改名后构建、重建、独立安装及真实HTTP与类型消费
        run: python scripts/verify_package.py --rename
      - name: 未改名的模板也必须正确打包
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13'
        run: python scripts/verify_package.py
      - name: 最低直接依赖
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        run: python scripts/verify_package.py --rename --minimum
